<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>gRitual — Daily gRitual on Ritual Testnet</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="https://cdn.jsdelivr.net/npm/ethers@6.13.2/dist/ethers.umd.min.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js" defer></script>
    <script src="config.js" defer></script>
    <script src="app.js" defer></script>
  </head>
  <body>
    <header class="topbar">
      <div class="left-nav">
        <button class="nav-btn" data-page="leaderboardPage">Leaderboard</button>
        <button class="nav-btn" data-page="cardPage">My Card</button>
      </div>
      <div class="right-nav">
        <button id="connectBtn">Connect Wallet</button>
        <button id="switchBtn" class="secondary">Switch Ritual</button>
      </div>
    </header>

    <main class="wrap">
      <section id="mainPage" class="page active">
        <img src="assets/gritual-logo.svg" class="main-logo" alt="logo" />
        <h1>gRitual</h1>
        <p class="small">One daily ritual on Ritual testnet</p>
        <div class="bubble">
          <p class="small">Daily limit 1x (UTC)</p>
          <button id="submitBtn" class="bubble-btn">Send gRitual</button>
          <p id="txState"></p>
        </div>
        <div class="profile-inline">
          <input id="twitterInput" type="text" placeholder="Twitter username" />
          <button id="saveTwitterBtn">Save</button>
          <div id="profileBox" class="profile"></div>
        </div>
        <p id="walletState" class="small">Wallet: not connected</p>
        <p id="networkState" class="small">Network: unknown</p>
      </section>

      <section id="leaderboardPage" class="page card">
        <div class="page-head"><h2>Leaderboard</h2><button id="refreshBtn" class="secondary">Refresh</button></div>
        <ul id="leaderboard"></ul>
      </section>

      <section id="cardPage" class="page card">
        <h2>My Identity Card</h2>
        <div id="rankCard" class="rank-card"></div>
        <div class="row">
          <button id="saveCardBtn" class="secondary">Save PNG</button>
          <button id="tweetCardBtn">Post to X</button>
        </div>
        <a class="creator" href="https://x.com/tanviriqbal0" target="_blank" rel="noreferrer">build by @tanviriqbal0</a>
      </section>
    </main>
  </body>
</html>
