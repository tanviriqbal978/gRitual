<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>gRitual — Daily gRitual on Ritual Testnet</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="https://cdn.jsdelivr.net/npm/ethers@6.13.2/dist/ethers.umd.min.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js" defer></script>
    <script src="config.js" defer></script>
    <script src="app.js" defer></script>
  </head>
  <body>
    <div class="bg-orb orb-a"></div>
    <div class="bg-orb orb-b"></div>

    <main class="container">
      <header class="hero card">
        <div class="brand">
          <img src="assets/gritual-logo.svg" alt="gRitual logo" id="brandLogo" />
          <div>
            <h1>gRitual</h1>
            <p>One daily ritual. On-chain. Ritual testnet.</p>
          </div>
        </div>
        <a class="creator" href="https://x.com/tanviriqbal0" target="_blank" rel="noreferrer">build by @tanviriqbal0</a>
      </header>

      <section class="card top-actions">
        <button id="connectBtn">Connect Wallet</button>
        <button id="switchBtn" class="secondary">Switch Ritual</button>
        <button id="refreshBtn" class="secondary">Refresh Board</button>
        <p id="walletState">Wallet: not connected</p>
        <p id="networkState">Network: unknown</p>
      </section>

      <section class="grid">
        <article class="card">
          <h2>Twitter Identity</h2>
          <label for="twitterInput">Username</label>
          <div class="row">
            <input id="twitterInput" type="text" placeholder="tanviriqbal0" />
            <button id="saveTwitterBtn">Save</button>
          </div>
          <div id="profileBox" class="profile"></div>

          <div class="ritual-cta">
            <p class="small">Limit: 1x per day (UTC)</p>
            <button id="submitBtn">Send gRitual</button>
            <p id="txState"></p>
          </div>
        </article>

        <article class="card">
          <h2>My Identity Card</h2>
          <div id="rankCard" class="rank-card"></div>
          <div class="row">
            <button id="saveCardBtn" class="secondary">Save PNG</button>
            <button id="tweetCardBtn">Post to X</button>
          </div>
        </article>
      </section>

      <section class="card">
        <h2>Leaderboard</h2>
        <ul id="leaderboard"></ul>
      </section>
    </main>
  </body>
</html>
